name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - feature/*

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.DB_USER }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DATABASE_URL: postgresql+psycopg2://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlalchemy psycopg[binary] python-dotenv

      - name: Wait for PostgreSQL to be ready
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "Waiting for PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U ${{ secrets.DB_USER }}; do
              sleep 2
          done
          echo "PostgreSQL is ready!"

      - name: Create database if it does not exist
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if ! psql -h localhost -p 5432 -U ${{ secrets.DB_USER }} -lqt | cut -d \| -f 1 | grep -qw ${{ secrets.DB_NAME }}; then
            echo "Database ${{ secrets.DB_NAME }} does not exist. Creating..."
            createdb -h localhost -p 5432 -U ${{ secrets.DB_USER }} ${{ secrets.DB_NAME }}
            echo "Database ${{ secrets.DB_NAME }} created!"
          else
            echo "Database ${{ secrets.DB_NAME }} already exists."
          fi

      - name: Initialize database tables via SQLAlchemy
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: ${{ secrets.DB_NAME }}
          DATABASE_URL: postgresql+psycopg2://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}
        run: |
          python create_db.py

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          pytest --cov=app tests/

      - name: Deploy to Hugging Face via SSH
        env:
          HF_SSH_KEY: ${{ secrets.HF_SSH_KEY }}
        run: |
          git config --global user.name "nix3s"
          git config --global user.email "paullesage59@gmail.com"

          mkdir -p ~/.ssh
          echo -e "$HF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan hf.co >> ~/.ssh/known_hosts

          ssh -T git@hf.co || true

          git clone git@hf.co:spaces/nix3s/futurisys_ml_api.git hf-space
          cd hf-space

          cp -r ../app.py ./
          cp -r ../requirements.txt ./
          cp -r ../app ./
          cp -r ../tests ./
	  #Ajout	
          git add .
          git commit -m "Update Space via CI/CD" || echo "No changes to commit"
          git push origin main
