name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - feature/*

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest --cov=app tests/

      - name: Deploy to Hugging Face via SSH
        env:
          HF_SSH_KEY: ${{ secrets.HF_SSH_KEY }}
        run: |
          git config --global user.name "nix3s"
          git config --global user.email "paullesage59@gmail.com"

          # Configurer SSH
          mkdir -p ~/.ssh
          echo -e "$HF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan huggingface.co >> ~/.ssh/known_hosts

          # Test SSH
          ssh -T git@huggingface.co || true

          # Cloner le repo via SSH
          git clone git@huggingface.co:nix3s/futurisys-ml-api.git hf-space
          cd hf-space

          # Copier les fichiers nécessaires
          cp -r ../app.py .
          cp -r ../requirements.txt .
          cp -r ../app .
          cp -r ../tests .

    # Commit des changements
    git add .
    git commit -m "Update Space via CI/CD" || echo "No changes to commit"

    # Push via SSH
    git push origin main