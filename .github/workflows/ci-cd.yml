name: CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - feature/*

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: futurisys_ml
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USER: postgres
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: futurisys_ml
      DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/futurisys_ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sqlalchemy psycopg[binary]
          pip install python-dotenv

      - name: Setup Database
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; do
            sleep 2
          done
          echo "PostgreSQL is ready. Creating tables..."
          python create_db.py

      - name: Run tests
        run: |
          echo "Running tests with database connection..."
          pytest --cov=app tests/

      - name: Deploy to Hugging Face via SSH
        env:
          HF_SSH_KEY: ${{ secrets.HF_SSH_KEY }}
        run: |
          git config --global user.name "nix3s"
          git config --global user.email "paullesage59@gmail.com"

          # Configurer SSH
          mkdir -p ~/.ssh
          echo -e "$HF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan hf.co >> ~/.ssh/known_hosts

          # Test SSH
          ssh -T git@hf.co || true

          # Cloner le repo via SSH
          git clone git@hf.co:spaces/nix3s/futurisys_ml_api.git hf-space
          cd hf-space

          # Copier les fichiers nécessaires
          cp -r ../app.py .
          cp -r ../requirements.txt .
          cp -r ../app .
          cp -r ../tests .

          # Commit des changements
          git add .
          git commit -m "Update Space via CI/CD" || echo "No changes to commit"

          # Push via SSH
          git push origin main
